<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
<meta
    name="theme-color"
    content="#180b18">
<title>SIPOUEH ❤️ LALITA</title>
<link
    rel="stylesheet"
    href="css/style.css">
</head>
<body class="login-page">
<!-- Cœurs animés -->
<div class="hearts-bg">
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
</div>
<div class="login-container">
    <div class="login-card">
        <div class="love-logo">
            <span>♥</span>
        </div>
        <div class="couple-name">
            SIPOUEH <span>❤️</span> LALITA
        </div>
        <h1>
            Private Love
        </h1>
        <p class="login-subtitle">
            Notre petit espace privé,
            rien que pour nous deux. 💕
        </p>
        <div class="input-group">
            <label for="email">
                Adresse e-mail
            </label>
            <input
                type="email"
                id="email"
                placeholder="Votre adresse e-mail"
                autocomplete="email"
                autocapitalize="none">
        </div>
        <div class="input-group">
            <label for="password">
                Mot de passe
            </label>
            <input
                type="password"
                id="password"
                placeholder="Votre mot de passe"
                autocomplete="current-password">
        </div>
        <button id="loginBtn">
            <span>
                Entrer dans notre monde ❤️
            </span>
        </button>
        <p id="message"></p>
        <div class="love-note">
            🔒 Cet espace est réservé à
            <strong>SIPOUEH & LALITA</strong>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
