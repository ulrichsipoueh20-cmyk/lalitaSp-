<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <meta
        name="theme-color"
        content="#180b18">
    <title>SIPOUEH ❤️ LALITA</title>
    <link
        rel="stylesheet"
        href="css/style.css">
</head>
<body class="chat-page">
    <!-- ===============================
         CŒURS FLOTTANTS
    ================================ -->
    <div class="hearts-bg">
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
    </div>
    <!-- ===============================
         CHAT
    ================================ -->
    <div class="chat-container">
        <!-- ===============================
             HEADER
        ================================ -->
        <header class="chat-header">
            <div class="couple-header">
                <div class="chat-heart">
                    ♥
                </div>
                <div>
                    <h2>
                        SIPOUEH
                        <span>❤️</span>
                        LALITA
                    </h2>
                    <div class="love-status">
                        <span class="online-dot"></span>
                        Notre conversation privée 💕
                    </div>
                </div>
            </div>
            <div class="header-right">
                <span
                    id="currentUserName"
                    class="current-user-name">
                </span>
                <button
                    id="logoutBtn"
                    class="logout-btn">
                    Quitter
                </button>
            </div>
        </header>
        <!-- ===============================
             MESSAGES
        ================================ -->
        <main
            id="messages"
            class="messages">
        </main>
        <!-- ===============================
             ZONE DE MESSAGE
        ================================ -->
        <div class="message-box">
            <!-- INPUT MÉDIA -->
            <input
                type="file"
                id="mediaInput"
                accept=“image/,video/,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip,.rar”
                hidden>
            <!-- BOUTON MÉDIA -->
<!-- INPUT PHOTO / VIDÉO -->
<input
    type="file"
    id="photoInput"
    accept="image/*,video/*"
    hidden>

<!-- BOUTON PHOTO -->
<button
    type="button"
    id="photoBtn"
    class="media-btn"
    aria-label="Envoyer une photo ou une vidéo">
    📷
</button>

         
            <!-- CHAMP MESSAGE -->
            <input
                type="text"
                id="messageInput"
                placeholder="Écris-moi quelque chose... ❤️"
                autocomplete="off"
                maxlength="2000">
            <!-- BOUTON VOCAL -->
            <button
                type="button"
                id="voiceBtn"
                class="voice-btn"
                aria-label="Message vocal">
          🎤
            </button>
            <!-- BOUTON ENVOYER -->
            <button
                type="button"
                id="sendBtn"
                aria-label="Envoyer">
                ♥
                
            </button>
        </div>
    </div>
    <!-- ===============================
         SUPABASE
    ================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
